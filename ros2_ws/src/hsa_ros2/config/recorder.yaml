# Parameters for demo_recorder. Load with --params-file (launch/desk_test.launch.xml does), then the robot's
# frames:  ros2 run hsa_ros2 demo_recorder --ros-args --params-file recorder.yaml --params-file robots/fr3.yaml
/**:
  ros__parameters:
    output_dir: ~/hsa_data/session      # one directory per dataset; the recorder appends across restarts
    image_topic: /camera/color/image_raw
    # base_frame / tcp_frame: config/robots/<robot>.yaml (add it with --params-file after this file)
    latency:
      camera: 0.030                     # photon -> header.stamp. ESTIMATE (half the 33 ms exposure); measure with latency_probe mode:=camera and keep equal to inference.yaml latency.gopro
      proprio: 0.001                    # libfranka stamps at read (UMI's value, not re-measured)
    store_every_n_frames: 1             # 1 -> store at the camera rate (30 Hz => obs_down_sample_steps: 3)
    stage_names: [insert, turn, open]   # subtasks by stage index; teleop keys 1-3 select them
    teleop_target_topic: /hsa/teleop_target
    action_source: teleop               # teleop (demos) | policy (rollouts: action = the policy's command chunks)
    policy_target_topic: /polyumi/target_poses_traj
    video:
      enabled: false                    # true: videos/episode_NNNN.mp4 (+ _frames.csv) per episode, full resolution
      fps: 30.0
    stage_topic: /hsa/stage
    # The ODrive HSA wrist (wrist_control workspace: ros2 launch wrist_control wrist_control.launch.py).
    # Each needs its topic live; the recorder skips frames until the wrist state / wrist camera arrive.
    wrist:
      enabled: false                    # true: robot0_wrist_* (extension, command, motor pos/vel, torque, Iq, bus V/I, temps, errors)
      topic: /hsa/wrist/state           # hsa_wrist_msgs/WristState from wrist_state_publisher (source that workspace)
    plate:
      enabled: false                    # true: robot0_plate_pos / _rot_axis_angle / _visible (plate displacement from rest)
      topic: /platform_pose             # camera_tracking platform_pose, in platform_zero (set_platform_zero once per mount)
      visible_topic: /platform_tag_visible
      max_age_s: 0.2                    # older than this (tags lost) -> plate_visible 0, the pose is held
    wrist_camera:
      enabled: false                    # true: camera1_rgb, the baseplate camera resized 224x224 (whole frame, no crop)
      topic: /tracking_cam/image_raw    # or /tracking_cam/image_raw/compressed (JPEG; less DDS traffic)
      max_age_s: 0.2                    # warn when the paired frame is older than this
    wrench:
      enabled: false                    # true on the station (needs the Franka state broadcaster)
      topic: /franka_robot_state_broadcaster/external_wrench_in_base_frame
    max_target_age_s: 0.5
    buffers:
      seconds: 2.0
    max_episode_s: 30.0                 # demos still recording after this are saved as failures (0 = no limit)
    min_steps: 46                       # warn on shorter episodes (UMI's sampler draws nothing from them)
    task_name: ''
    plan: ''                            # CSV, any columns, one row per episode (grid cells, wrist, stiffness, ...);
                                        #   rows advance when an episode is saved, 'n' skips one, all columns go to the sidecar
    condition: ''                       # free-form tag for the next episodes: ros2 param set /hsa_recorder condition 'stiff'
    advance_plan_on_save: true
    wrist_set: ''
    wrist_hours: 0.0
    notes: ''
